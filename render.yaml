databases:
  - name: vitallog-db
    databaseName: vitallog
    user: vitallog
    plan: free

services:
  - type: web
    name: vitallog-backend
    env: python
    region: oregon
    plan: free
    rootDir: vitallog_backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn vitallog_backend.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: vitallog-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000"
      - key: PYTHON_VERSION
        value: "3.12.0"